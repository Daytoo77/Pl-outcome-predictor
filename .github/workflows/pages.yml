name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Dead links and figure provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fails the build on any internal link or #fragment in docs/ that does not resolve.
      - name: Check internal links
        run: python tools/check_links.py
      # Fails the build if a figure shown on the site no longer matches its committed artefact.
      - name: Check displayed numbers against artefacts
        run: python tools/check_numbers.py

  parity:
    name: Model parity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy==2.5.2 pandas==3.0.5 xgboost==3.4.1 pyarrow==25.0.0
      # Rebuilds every feature from the raw season files and asserts that the committed models
      # reproduce data/ui_predictions.json on the 350 holdout matches to within rounding.
      - name: Rebuild features and reproduce the published holdout predictions
        run: python predict_upcoming.py --check

  deploy:
    name: Deploy docs/ to GitHub Pages
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
